<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIZUNA | Anime Market Intelligence</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --surface: #FFFFFF;
      --text-main: #111827;
      --text-muted: #6B7280;
      --border: #E5E7EB;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { background-color: var(--bg); color: var(--text-main); }

    /* Simple Navbar */
    .nav {
      background: var(--surface);
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .nav .brand { font-weight: 700; font-size: 20px; color: var(--primary); text-decoration: none; }
    .nav .links a { margin-left: 20px; text-decoration: none; color: var(--text-muted); font-weight: 500; }
    .nav .links a:hover { color: var(--primary); }

    /* Page Header & Search */
    .header { padding: 40px 40px 20px 40px; }
    .header h1 { font-size: 28px; margin-bottom: 16px; }
    .search-bar {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar:focus { border-color: var(--primary); }

    /* Grid Layout */
    .catalog-container {
      padding: 20px 40px 60px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Anime Card Styling */
    .anime-card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .anime-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .card-image { width: 100%; height: 300px; object-fit: cover; background-color: #E5E7EB; }
    .card-content { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
    
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { background: #EEF2FF; color: var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    
    /* Match Button */
    .match-btn {
      margin-top: 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .match-btn:hover { background-color: var(--primary-hover); }

    /* Modal / Popup UI */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white; padding: 30px; border-radius: 12px;
      width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
    
    .match-result-card {
      display: flex; align-items: center; gap: 16px;
      padding: 16px; border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 12px;
      background: #F9FAFB;
    }
    .match-details { flex-grow: 1; }
    
    /* Loading Animation inside Modal */
    .loader-container { text-align: center; padding: 30px; color: var(--primary); font-weight: 600; }
    .spinner {
      border: 4px solid rgba(79, 70, 229, 0.2);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px; height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Market Data Buttons */
    .action-row { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .trends-btn {
      display: inline-block; font-size: 12px; padding: 6px 12px;
      background: #E5E7EB; color: var(--text-main); text-decoration: none;
      border-radius: 4px; font-weight: 600; transition: background 0.2s;
    }
    .trends-btn:hover { background: #D1D5DB; }
    .yt-btn { background: #FEE2E2; color: #DC2626; }
    .yt-btn:hover { background: #FECACA; }

    #loading { padding: 40px; text-align: center; font-size: 18px; color: var(--text-muted); }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html">KIZUNA</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="input.html">Add Anime</a>
      <a href="Catalog.html" style="color: var(--primary);">Catalog</a>
    </div>
  </nav>

  <div class="header">
    <h1>Anime Market Intelligence Catalog</h1>
    <input type="text" id="searchInput" class="search-bar" placeholder="Search saved anime...">
  </div>

  <div id="loading">Connecting to Firebase...</div>
  <div class="catalog-container" id="catalogGrid"></div>

  <!-- MATCHING ENGINE MODAL -->
  <div class="modal-overlay" id="matchModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Similar Anime</h2>
        <button class="close-btn" onclick="document.getElementById('matchModal').style.display='none'">&times;</button>
      </div>
      <p id="modalSubtitle" style="margin-bottom: 20px; color: #6B7280; font-size: 14px;">
        Finding comparable titles within the KIZUNA catalog.
      </p>
      
      <!-- Container for Results or Loading Spinner -->
      <div id="matchResultsList"></div>
    </div>
  </div>

  <!-- FIREBASE CATALOG AND LOCAL SIMILARITY ENGINE -->
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

  // Firebase web configuration is public. Firestore access must be protected by security rules.
  const firebaseConfig = {
    apiKey: "AIzaSyCdobRCI4rLnwx5lpd_ASIZeMfDiq433hA",
    authDomain: "kizuna-c70d2.firebaseapp.com",
    projectId: "kizuna-c70d2",
    storageBucket: "kizuna-c70d2.firebasestorage.app",
    messagingSenderId: "513173983571",
    appId: "1:513173983571:web:53b3da640e656eb6b2d1a6",
    measurementId: "G-66RQE9B093"
  };

  const db = getFirestore(initializeApp(firebaseConfig));
  const $ = id => document.getElementById(id);
  let allAnime = [];

  function element(tag, className, value) {
    const result = document.createElement(tag);
    if (className) result.className = className;
    if (value !== undefined) result.textContent = String(value);
    return result;
  }

  function titleOf(anime) {
    return String(anime.identity?.title || anime.title || "Unknown Title");
  }

  function normalizedList(value) {
    if (Array.isArray(value)) return value.map(v => String(v).trim().toLowerCase()).filter(Boolean);
    if (!value) return [];
    return String(value).split(",").map(v => v.trim().toLowerCase()).filter(Boolean);
  }

  function imageUrl(raw) {
    try {
      const url = new URL(String(raw), window.location.href);
      return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
    } catch {
      return "";
    }
  }

  function renderGrid(items) {
    const grid = $("catalogGrid");
    grid.replaceChildren();
    if (!items.length) {
      grid.append(element("p", "", "No anime titles found."));
      return;
    }

    items.forEach(anime => {
      const card = element("article", "anime-card");
      const src = imageUrl(anime.media?.coverImageUrl);
      if (src) {
        const cover = element("img", "card-image");
        cover.src = src;
        cover.alt = "Cover for " + titleOf(anime);
        cover.loading = "lazy";
        cover.referrerPolicy = "no-referrer";
        cover.onerror = () => cover.remove();
        card.append(cover);
      }

      const content = element("div", "card-content");
      const tags = element("div", "tags");
      const genres = normalizedList(anime.identity?.genres || anime.genres).slice(0, 3);
      genres.forEach(genre => tags.append(element("span", "tag", genre)));
      const title = element("h2", "card-title", titleOf(anime));
      const button = element("button", "match-btn", "Find Similar Anime");
      button.type = "button";
      button.addEventListener("click", () => showMatches(anime));
      content.append(tags, title, button);
      card.append(content);
      grid.append(card);
    });
  }

  function overlap(a, b) {
    const bSet = new Set(normalizedList(b));
    return normalizedList(a).filter(v => bSet.has(v)).length;
  }

  function similarity(a, b) {
    const aa = a.identity || {}, bb = b.identity || {};
    return (
      4 * overlap(aa.genres || a.genres, bb.genres || b.genres) +
      3 * overlap(aa.themes || aa.themesAndTropes, bb.themes || bb.themesAndTropes) +
      2 * overlap(aa.tone, bb.tone) +
      3 * overlap(a.demographics?.target || a.demographic?.tag, b.demographics?.target || b.demographic?.tag)
    );
  }

  function externalLink(label, href, additionalClass) {
    const link = element("a", "trends-btn" + (additionalClass ? " " + additionalClass : ""), label);
    link.href = href;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    return link;
  }

  function showMatches(selected) {
    const modal = $("matchModal");
    $("modalTitle").textContent = "Similar titles to " + titleOf(selected);
    $("modalSubtitle").textContent = "Catalog-based matching by genre, theme, tone, and demographic; not an AI prediction.";
    modal.style.display = "flex";

    const results = $("matchResultsList");
    results.replaceChildren();
    const targetTitle = titleOf(selected).toLowerCase();
    const comparable = allAnime
      .filter(anime => anime.id !== selected.id && titleOf(anime).toLowerCase() !== targetTitle)
      .map(anime => ({anime, score: similarity(selected, anime)}))
      .sort((a, b) => b.score - a.score)
      .slice(0, 3);

    if (!comparable.length) {
      results.append(element("p", "", "No other titles are saved yet. Add more anime to enable matching."));
      return;
    }

    comparable.forEach(({anime, score}) => {
      const title = titleOf(anime);
      const card = element("div", "match-result-card");
      const details = element("div", "match-details");
      const titleNode = element("div", "", title);
      titleNode.style.fontWeight = "bold";
      titleNode.style.marginBottom = "8px";
      const explanation = element(
        "div", "", score > 0 ? "Shared catalog attributes: " + score + " weighted points" : "Other catalog title (no shared attributes recorded)"
      );
      explanation.style.marginBottom = "8px";
      const actions = element("div", "action-row");
      actions.append(
        externalLink("Google Trends", "https://trends.google.com/trends/explore?geo=IN&q=" + encodeURIComponent(title)),
        externalLink("Find Trailer", "https://www.youtube.com/results?search_query=" + encodeURIComponent(title + " anime official trailer"), "yt-btn")
      );
      details.append(titleNode, explanation, actions);
      card.append(details);
      results.append(card);
    });
  }

  $("searchInput").addEventListener("input", event => {
    const term = event.target.value.trim().toLowerCase();
    renderGrid(allAnime.filter(anime => titleOf(anime).toLowerCase().includes(term)));
  });

  async function fetchAnimeCatalog() {
    try {
      const snapshot = await getDocs(collection(db, "anime_profiles"));
      allAnime = snapshot.docs.map(record => ({...record.data(), id: record.id}));
      $("loading").style.display = "none";
      renderGrid(allAnime);
    } catch (error) {
      console.error("Catalog fetch failed:", error);
      $("loading").textContent = "Could not load the catalog. Check your network connection or Firestore read permissions.";
    }
  }

  fetchAnimeCatalog();
</script>
</body>
</html>
