<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, getDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdobRCI4rLnwx5lpd_ASIZeMfDiq433hA",
    authDomain: "kizuna-c70d2.firebaseapp.com",
    projectId: "kizuna-c70d2",
    storageBucket: "kizuna-c70d2.firebasestorage.app",
    messagingSenderId: "513173983571",
    appId: "1:513173983571:web:53b3da640e656eb6b2d1a6",
    measurementId: "G-66RQE9B093"
  };
  const db = getFirestore(initializeApp(firebaseConfig));

  const $ = id => document.getElementById(id);
  const el = (t, a = {}, ...c) => {
    const e = document.createElement(t);
    for (const k in a) e.setAttribute(k, a[k]);
    c.flat().forEach(x => e.append(x));
    return e;
  };
  const has = v => Array.isArray(v) ? v.length > 0 : v !== undefined && v !== "" && v !== null;

  /* ---------- 1. Load data: Firestore (if ?id=) or this tab's session ---------- */
  let savedId = new URLSearchParams(location.search).get("id");

  function fromPayload(p) {
    return {
      title: p.identity?.title, story: p.identity?.story, genres: p.identity?.genres,
      themes: p.identity?.themes, tone: p.identity?.tone,
      demo: p.demographics?.target,
      eps: p.format?.eps, len: p.format?.len, src: p.format?.src, status: p.format?.status,
      studio: p.production?.studio, director: p.production?.director,
      viol: p.sensitivity?.viol, sex: p.sensitivity?.sex, rate: p.sensitivity?.rate,
      langs: p.market?.langs, plat: p.market?.plat, timing: p.market?.timing, rights: p.market?.rights,
      coverImageUrl: p.media?.coverImageUrl
    };
  }

  async function loadData() {
    if (savedId) {
      try {
        const snap = await getDoc(doc(db, "anime_profiles", savedId));
        if (snap.exists()) return fromPayload(snap.data());
      } catch (e) { console.error("Load error:", e); }
    }
    try {
      const raw = sessionStorage.getItem("kizunaReport");
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  /* ---------- 2. Prediction engine ---------- */
  function predictAudience(S) {
    const scores = { kids: 0, genz: 0, millennials: 0 };
    // Only the structured fields are scored, so words in the title/story don't skew the result
    const strData = JSON.stringify({
      genres: S.genres, themes: S.themes, tone: S.tone, demo: S.demo,
      viol: S.viol, sex: S.sex, rate: S.rate
    }).toLowerCase();

    if (strData.includes("kids") || strData.includes("family")) scores.kids += 5;
    if (strData.includes("wholesome")) scores.kids += 3;
    if (strData.includes("all ages")) scores.kids += 3;

    if (strData.includes("shonen") || strData.includes("shojo")) scores.genz += 5;
    if (strData.includes("action") || strData.includes("adventure") || strData.includes("sports")) scores.genz += 3;
    if (strData.includes("coming of age") || strData.includes("school life") || strData.includes("sports rivalry")) scores.genz += 3;

    if (strData.includes("seinen") || strData.includes("josei")) scores.millennials += 5;
    if (strData.includes("psychological") || strData.includes("thriller") || strData.includes("suspense") || strData.includes("crime")) scores.millennials += 4;
    if (strData.includes("workplace") || strData.includes("conspiracy")) scores.millennials += 3;
    if (strData.includes("r-17+") || strData.includes("r+") || strData.includes("strong")) scores.millennials += 4;

    const max = Math.max(scores.kids, scores.genz, scores.millennials);
    let winner = "genz";
    if (max === scores.kids && max > 0) winner = "kids";
    else if (max === scores.millennials && max > 0) winner = "millennials";
    return winner;
  }

  const SEGMENTS = {
    kids: {
      short: "Kids", icon: "🧒", accent: "#f59e0b", age: [6, 12], ageLabel: "6–12 Years",
      aud: "Predicted Target: Kids (6–12 Years)",

  /* Pick up the site's own colours and heading font from style.css */
  function applySiteTheme() {
    const root = document.documentElement.style;
    const probe = el("button", { "class": "btn primary", "type": "button", "style": "position:absolute;visibility:hidden;pointer-events:none" }, "x");
    document.body.append(probe);
    const cs = getComputedStyle(probe);
    const clear = c => !c || c === "transparent" || /,\s*0\)$/.test(c);
    const first = c => (c.match(/rgba?\([^)]+\)/) || [""])[0];
    let accent = cs.backgroundColor;
    if (clear(accent)) accent = first(cs.backgroundImage);
    if (clear(accent)) accent = cs.borderTopColor;
    if (clear(accent)) accent = cs.color;
    if (!clear(accent)) root.setProperty("--accent", accent);
    const on = cs.color;
    if (!clear(on) && on !== accent) root.setProperty("--on-accent", on);
    probe.remove();
    const h = document.querySelector("h1");
    if (h) root.setProperty("--head-font", getComputedStyle(h).fontFamily);
  }

    { label: "25–34", key: "25-34" }, { label: "35+", key: "35+" }

  const SEG_AGE = { kids: "25-34", genz: "18-24", millennials: "25-34" };
  const WEIGHTS = { R: 0.35, I: 0.30, E: 0.20, C: 0.15 };
  const TIERS = [

  const PROTO = {
    "13-17": { youtube: [92, 85, 80, 80], instagram: [80, 65, 70, 65], creators: [55, 85, 80, 75], snapchat: [70, 45, 50, 60], reddit: [20, 60, 50, 70], discord: [40, 70, 50, 40] },

  // DataReportal, Digital 2026: India (late 2025 advertising reach, millions, all ages)
  const REACH = [["YouTube", 500], ["Instagram", 481], ["Snapchat", 213], ["Reddit", 30.8]];

  const ageLabel = key => AGE_GROUPS.find(a => a.key === key).label;
  const clamp = v => Math.min(100, Math.max(0, v));
  const adScore = (r, i, e, c) => WEIGHTS.R * r + WEIGHTS.I * i + WEIGHTS.E * e + WEIGHTS.C * c;
  const tierOf = sc => TIERS.find(t => sc >= t.min).t;
  const normPlatform = s => {
    const k = String(s || "").toLowerCase().replace(/[^a-z]/g, "");
    const alias = { instagramreels: "instagram", animecreatorchannels: "creators", creator: "creators", creatorchannels: "creators" };
    return alias[k] || k;
  };

  const statCache = {};
  async function loadStats(ageKey) {
    if (statCache[ageKey]) return statCache[ageKey];
    const rows = {};
    PLATFORMS.forEach(p => {
      const v = PROTO[ageKey][p.id];
      rows[p.id] = { p, r: v[0], i: v[1], e: v[2], c: v[3], source: "Illustrative", live: false };
    });
    try {
      const snap = await getDocs(query(collection(db, "social_media_age_stats"), where("age_group", "==", ageKey)));
      snap.forEach(d => {
        const x = d.data(), id = normPlatform(x.platform);
        if (!rows[id]) return;
        const n = [x.reach_score, x.anime_interest_score, x.engagement_score, x.cost_efficiency_score];
        if (n.every(v => typeof v === "number" && isFinite(v))) {
          Object.assign(rows[id], { r: clamp(n[0]), i: clamp(n[1]), e: clamp(n[2]), c: clamp(n[3]), source: x.data_source || "KIZUNA data", live: true });
        }
      });
    } catch (e) { console.warn("social_media_age_stats not available, using illustrative scores:", e.message); }
    const out = Object.values(rows).map(r => {
      const score = adScore(r.r, r.i, r.e, r.c);
      return Object.assign(r, { score, tier: tierOf(score) });
    }).sort((a, b) => b.score - a.score);
    statCache[ageKey] = out;
    return out;
  }

      span("caption", "These are initial strategic tiers, not verified rankings of anime dubbing demand. The best language mix may differ significantly for each title.")
    );

    // 2. What the research says about dubbing in India (Demand Signals & Sources)
    const hakuLink1 = el("a", { "href": "https://www.hakuhodo-global.com/", "target": "_blank", "rel": "noopener" }, "Hakuhodo India survey, 2026");
    const hakuLink2 = el("a", { "href": "https://www.hakuhodo-global.com/", "target": "_blank", "rel": "noopener" }, "Hakuhodo India survey, 2026");
    const bsLink = el("a", { "href": "https://www.business-standard.com/", "target": "_blank", "rel": "noopener" }, "Entertainment News - Business Standard");

    const evGrid = div("ev-grid",
      div("ev-card",
        span("kicker", "Accessibility & preference"),
        div("ev-stat", "61.1%"),
        div("ev-label", "Prefer dubbed anime"),
        el("div", { "class": "ev-src" }, "Source: ", hakuLink1)),
      div("ev-card",
        span("kicker", "Language preference"),
        div("ev-stat", "73.1%"),
        div("ev-label", "Prefer Hindi among dubbed-language choices"),
        el("div", { "class": "ev-src" }, "Surveyed anime viewers · ", hakuLink2)),
      div("ev-card",
        span("kicker", "Platform consumption signal"),
        div("ev-stat", "> 65%"),
        div("ev-label", "Crunchyroll India anime viewership from Hindi, Tamil, and Telugu dubs"),
        el("div", { "class": "ev-src" }, "Source: ", bsLink))
    );

    const cardResearch = secCard("10", "What the Research Says About Dubbing in India",
      el("p", { "class": "strat-text", "style": "margin-bottom:14px" }, "There is real evidence that dubbing can improve accessibility and viewership, though every launch must be evaluated with its own unit economics."),
      evGrid,
      div("notice",
        el("strong", {}, "Scope & methodology caveats: "),
        "The Hakuhodo India survey (2026) focused on interested anime viewers aged 15–39 in selected Indian cities, not India's entire population. Furthermore, while Crunchyroll reported that more than 65% of its anime viewership in India came from Hindi, Tamil, and Telugu dubs, this is a strong signal for localization—not a 65% probability that any new anime will succeed.")
    );

    // 3. Dubbing Feasibility Calculator (Financial Feasibility + Market Fit Score)
    const calcLangs = DUB_LANGS.slice(0, 6); // Hindi, Tamil, Telugu, Malayalam, Bengali, Kannada
    const selectedLangs = new Set(calcLangs.filter(l => l.defaultOn).map(l => l.name));

    const langCheckWrap = div("lang-checks");
    const checkInputs = {};
    calcLangs.forEach(l => {
      const cb = el("input", { "type": "checkbox" });
      cb.checked = l.defaultOn;
      checkInputs[l.name] = cb;
      const lbl = el("label", { "class": "lang-check" }, cb, span("", l.name));
      langCheckWrap.append(lbl);
    });

    const makeNumInput = (val, min = 0, step = 1) => {
      const inp = el("input", { "type": "number", "min": String(min), "step": String(step), "value": String(val) });
      return inp;
    };

    // Default scenario values matching the specification:
    // 3 languages (Hindi, Tamil, Telugu) × 12 episodes × ₹40,000/ep + ₹2,00,000 other = ₹16,40,000 total investment
    // 1,50,000 additional viewers × ₹12/viewer = ₹18,00,000 incremental revenue -> ₹1,60,000 net return (9.8% ROI)
    const inpEps = makeNumInput(12, 1, 1);
    const inpCostPerEp = makeNumInput(40000, 0, 1000);
    const inpViewers = makeNumInput(150000, 0, 1000);
    const inpRevPerViewer = makeNumInput(12, 0, 1);
    const inpOtherCost = makeNumInput(200000, 0, 5000);

    const valInvest = div("res-val", "₹16,40,000");
    const valRev = div("res-val", "₹18,00,000");
    const valNet = div("res-val", "₹1,60,000");
    const valRoi = div("res-val", "9.8%");
    const beStatus = div("be-banner", "Break-even reached in this scenario");
    const beDetail = el("p", { "class": "strat-text", "style": "margin-bottom:8px" });

    // Market Fit Score interactive sliders (D, L, P, Q, B)
    const fitState = {};
    const fitGrid = div("fit-grid");
    FIT_FACTORS.forEach(f => {
      fitState[f.key] = f.def;
      const valBadge = el("strong", {}, String(f.def));
      const rng = el("input", { "type": "range", "min": "0", "max": "100", "step": "1", "value": String(f.def) });
      rng.addEventListener("input", () => {
        fitState[f.key] = Number(rng.value);
        valBadge.textContent = rng.value;
        updateAll();
      });
      fitGrid.append(div("fit-item",
        div("fit-top", span("", `${f.key} · ${f.name} (${Math.round(f.weight * 100)}%)`), valBadge),
        rng
      ));
    });

    const fitBadge = div("tierbadge", "B");
    const fitBadgeWrap = div("tier-B", fitBadge);
    const fitScoreText = el("div", { "class": "lvl" }, "75.0 / 100");
    const fitNoteText = span("tiersub", "A tier · Secondary / promising market fit (score 70–84)");

    // Dynamic Studio Recommendation nodes (Card 13)
    const recLangsDd = el("dd", {}, "Hindi, Tamil, Telugu");
    const recOppDd = el("dd", {}, "Promising, subject to title-specific demand validation");
    const recFinDd = el("dd", {}, "Calculated from the studio's actual costs and expected incremental revenue");

    function updateAll() {
      const activeLangs = calcLangs.filter(l => checkInputs[l.name].checked).map(l => l.name);
      const langCount = activeLangs.length;
      const eps = Math.max(0, Number(inpEps.value) || 0);
      const costPerEp = Math.max(0, Number(inpCostPerEp.value) || 0);
      const viewers = Math.max(0, Number(inpViewers.value) || 0);
      const revPerViewer = Math.max(0, Number(inpRevPerViewer.value) || 0);
      const otherCost = Math.max(0, Number(inpOtherCost.value) || 0);

      const totalCost = (langCount * eps * costPerEp) + otherCost;
      const incRev = viewers * revPerViewer;
      const netReturn = incRev - totalCost;
      const roi = totalCost > 0 ? ((incRev - totalCost) / totalCost) * 100 : 0;
      const breakEvenViewers = revPerViewer > 0 ? Math.ceil(totalCost / revPerViewer) : 0;

      valInvest.textContent = fmtINR(totalCost);
      valRev.textContent = fmtINR(incRev);
      valNet.textContent = (netReturn < 0 ? "−" : "") + fmtINR(Math.abs(netReturn));
      valRoi.textContent = totalCost > 0 ? roi.toFixed(1) + "%" : "0.0%";

      if (totalCost === 0) {
        beStatus.className = "be-banner warn";
        beStatus.textContent = "Enter dubbing or localization costs to model break-even";
        beDetail.textContent = "No investment entered in this scenario.";
      } else if (netReturn >= 0) {
        beStatus.className = "be-banner";
        beStatus.textContent = "Break-even reached in this scenario";
        beDetail.textContent = revPerViewer > 0
          ? `Break-even requires approximately ${fmtNum(breakEvenViewers)} additional paying-equivalent viewers.`
          : "Set a positive revenue per additional viewer to compute break-even viewer count.";
      } else {
        beStatus.className = "be-banner warn";
        beStatus.textContent = "Below break-even in this scenario";
        beDetail.textContent = revPerViewer > 0
          ? `Break-even requires approximately ${fmtNum(breakEvenViewers)} additional paying-equivalent viewers (${fmtNum(Math.max(0, breakEvenViewers - viewers))} more than current scenario).`
          : "Set a positive revenue per additional viewer to compute break-even viewer count.";
      }

      // Market Fit Score F = 0.30D + 0.25L + 0.20P + 0.15Q + 0.10B
      const F = (0.30 * fitState.D) + (0.25 * fitState.L) + (0.20 * fitState.P) + (0.15 * fitState.Q) + (0.10 * fitState.B);
      const fTier = tierOf(F);
      const fTierMeta = TIERS.find(t => t.t === fTier);

      fitBadgeWrap.className = "tier-" + fTier;
      fitBadge.textContent = fTier;
      fitScoreText.textContent = F.toFixed(1) + " / 100";
      fitNoteText.textContent = `${fTier} tier (${fTierMeta.range}) · Documented scenario score, not a probability of launch success`;

      // Update Card 13 Studio Summary
      recLangsDd.textContent = activeLangs.length ? activeLangs.join(", ") : "None selected (test localized subtitles/trailers first)";
      const oppLabels = {
        S: "High strategic fit (Tier S), subject to title-specific demand validation",
        A: "Promising (Tier A), subject to title-specific demand validation",
        B: "Moderate / experimental (Tier B), requires localized demand testing before full commitment",
        C: "Low initial priority (Tier C), validate organic audience demand before dubbing"
      };
      recOppDd.textContent = `${oppLabels[fTier]} (Market Fit Score: ${F.toFixed(1)}/100)`;
      recFinDd.textContent = `Calculated from the studio's actual costs and expected incremental revenue (Scenario estimate: ${fmtINR(totalCost)} total investment vs. ${fmtINR(incRev)} incremental revenue; ${roi.toFixed(1)}% ROI; break-even at ~${fmtNum(breakEvenViewers)} paying-equivalent viewers)`;
    }

    [inpEps, inpCostPerEp, inpViewers, inpRevPerViewer, inpOtherCost].forEach(inp =>
      inp.addEventListener("input", updateAll));
    Object.values(checkInputs).forEach(cb => cb.addEventListener("change", updateAll));

    const cardCalc = secCard("11", "Dubbing Feasibility Calculator for KIZUNA",
      el("h4", { "class": "calc-subhead" }, "A. Dubbing Financial Feasibility (Scenario Model)"),
      el("p", { "class": "strat-text", "style": "margin-bottom:12px" }, "Adjust the assumptions to estimate the break-even point of a dubbed anime launch in India."),
      span("kicker", "Languages to dub"),
      langCheckWrap,
      div("calc-inputs",
        el("label", { "class": "calc-field" }, span("", "Episodes"), inpEps),
        el("label", { "class": "calc-field" }, span("", "Dub cost per episode, per language (₹)"), inpCostPerEp),
        el("label", { "class": "calc-field" }, span("", "Additional paying-equivalent viewers"), inpViewers),
        el("label", { "class": "calc-field" }, span("", "Revenue per additional viewer (₹)"), inpRevPerViewer),
        el("label", { "class": "calc-field" }, span("", "Other localization and marketing costs (₹)"), inpOtherCost)
      ),
      div("calc-results",
        div("res-card", span("kicker", "Total investment"), valInvest),
        div("res-card", span("kicker", "Projected incremental revenue"), valRev),
        div("res-card", span("kicker", "Net return"), valNet),
        div("res-card", span("kicker", "Estimated ROI"), valRoi)
      ),
      beStatus,
      beDetail,
      span("caption", "All default monetary values and viewer estimates are hypothetical, not current industry quotations or forecasts. The model assumes incremental revenue is attributable to dubbing and excludes licensing costs unless entered in other costs."),
      el("hr", { "class": "fit-divider" }),
      el("h4", { "class": "calc-subhead" }, "B. Market Fit Score (0–100)"),
      el("p", { "class": "strat-text" }, "How promising the dubbing strategy looks based on audience demand, language fit, distribution, and localization quality. Score each factor from 0–100 using actual research or documented assumptions:"),
      fitGrid,
      div("fit-summary",
        fitBadgeWrap,
        div("tierinfo", span("kicker", "Weighted Market Fit Score (F)"), fitScoreText, fitNoteText)
      )
    );

    // 4. How to calculate the feasibility rate
    const factorTable = el("table", { "class": "ttable wrap-last" },
      el("thead", {}, el("tr", {}, el("th", {}, "Factor"), el("th", {}, "Weight"), el("th", {}, "Meaning"))),
      el("tbody", {}, ...FIT_FACTORS.map(f => el("tr", {},
        el("td", {}, el("strong", {}, f.key)),
        el("td", {}, Math.round(f.weight * 100) + "%"),
        el("td", {}, f.name)
      )))
    );

    const cardFormula = secCard("12", "How to Calculate the Feasibility Rate",
      span("kicker", "1. Financial Return on Investment (ROI)"),
      div("formula", "ROI = ((Incremental Revenue − Total Cost) / Total Cost) × 100"),
      span("kicker", "2. Weighted Market-Fit Score (F)"),
      div("formula", "F = 0.30·D + 0.25·L + 0.20·P + 0.15·Q + 0.10·B"),
      div("tscroll", factorTable),
      div("tiers-legend", { "style": "margin-top:12px" }, ...TIERS.map(t => el("span", { "class": "legend-item" }, span("minitier tier-" + t.t, t.t), t.range))),
      div("notice", { "style": "margin-top:12px;margin-bottom:0" },
        el("strong", {}, "Important interpretation rule: "),
        "Each factor should be scored from 0–100 using actual research or documented assumptions. The weights are provisional. You can categorize the score into S, A, B, and C tiers, but do not describe an 85/100 score as an 85% chance of success. A probability requires historical launch outcomes and a validated predictive model.")
    );

    // 5. Final Studio Dubbing Recommendation
    const cardDubRec = secCard("13", "Dubbing & Localization Recommendation for Japanese Studios",
      div("rec-head",
        span("kicker", "B2B executive summary"),
        el("div", { "class": "rec-seg" }, (S.title || "Untitled anime") + " — Localization Blueprint")
      ),
      el("dl", { "class": "rec-kv" },
        el("dt", {}, "Anime"), el("dd", {}, S.title || "Untitled anime"),
        el("dt", {}, "Recommended first dubbing languages"), recLangsDd,
        el("dt", {}, "Market opportunity"), recOppDd,
        el("dt", {}, "Financial feasibility"), recFinDd,
        el("dt", {}, "Next action"), el("dd", {}, el("strong", {}, "Test localized trailers and measure demand before commissioning a full-season dub."))
      )
    );

    updateAll();

    return div("tiersec",
      el("h2", { "class": "tiersec-title" }, "Section 6 — AI Dubbing Language & India Market Feasibility Analyzer"),
      el("p", { "class": "hint" }, "Which Indian languages should a Japanese studio dub into, and does the localization investment make commercial sense?"),
      div("strategy", cardPriority, cardResearch, cardCalc, cardFormula, cardDubRec)
    );
  }

  /* ---------- 3. Save from the report page (when not already saved) ---------- */
  async function saveNow(S) {
    const payload = {
      identity: { title: S.title, genres: S.genres || [], story: S.story || "", themes: S.themes || [], tone: S.tone || "" },
      demographics: { target: S.demo || "" },
      format: { eps: S.eps || 0, len: S.len || 0, src: S.src || "", status: S.status || "" },
      production: { studio: S.studio || "", director: S.director || "" },
      sensitivity: { viol: S.viol || "", sex: S.sex || "", rate: S.rate || "" },
      market: { langs: S.langs || [], plat: S.plat || "", timing: S.timing || "", rights: S.rights || "" },
      media: { coverImageUrl: S.coverImageUrl || "" },
      createdAt: new Date().toISOString()
    };
    return (await addDoc(collection(db, "anime_profiles"), payload)).id;
  }

  /* ---------- 4. Render ---------- */
  function renderReport(S) {
    const box = $("report");
    box.replaceChildren();

    // Portfolio box: name (large) + 4 key points
    const point = (k, v) => el("div", { "class": "pt" },
      el("span", { "class": "k" }, k),
      el("span", { "class": "v" }, has(v) ? v : "Not provided"));

    const toneTheme = [S.tone, has(S.themes) ? S.themes[0] : ""].filter(Boolean).join(" · ");

    const card = el("div", { "class": "portfolio" });
    if (S.coverImageUrl) {
      const img = el("img", { "class": "cover", src: S.coverImageUrl, alt: "Cover of " + (S.title || "the anime"), referrerpolicy: "no-referrer" });
      img.onerror = () => img.remove();
      card.append(img);
    }
    card.append(
      el("div", { "class": "name" },
        el("p", { "class": "tag" }, "Anime portfolio"),
        el("h2", {}, S.title || "Untitled anime")),
      el("div", { "class": "points" },
        point("Main genre", has(S.genres) ? S.genres[0] : ""),
        point("Age rating", S.rate),
        point("Demographic tag", S.demo),
        point("Tone / Theme", toneTheme))
    );

    // Illustrated strategy, Advertising Tier Engine, and Dubbing & Market Feasibility Analyzer
    const segKey = predictAudience(S);
    const strategy = renderStrategy(SEGMENTS[segKey]);
    const tierSection = renderTierSection(segKey, S);
    const dubbingSection = renderDubbingSection(S);

    // Actions
    const actions = el("div", { "class": "actions" });
    const msg = el("p", { "class": "note", "role": "status", "style": "font-weight:bold;margin-top:10px" });

    if (savedId) {
      msg.textContent = "✅ This title is saved in the KIZUNA database.";
      msg.style.color = "#2e7d32";
    } else {
      const saveBtn = el("button", { "type": "button", "class": "btn" }, "Save to KIZUNA database");
      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        msg.style.color = "#666";
        msg.textContent = "⏳ Saving...";
        try {
          savedId = await saveNow(S);
          history.replaceState(null, "", "output.html?id=" + encodeURIComponent(savedId));
          msg.style.color = "#2e7d32";
          msg.textContent = "✅ Saved to the KIZUNA database.";
          saveBtn.remove();
        } catch (e) {
          console.error(e);
          msg.style.color = "#d32f2f";
          msg.textContent = "❌ Error: " + e.message;
          saveBtn.disabled = false;
        }
      };
      actions.append(saveBtn);
    }
    const again = el("a", { "class": "btn", "href": "input.html" }, "← Edit details");
    const cat = el("a", { "class": "btn primary", "href": "catalog.html" }, "View catalog");
    actions.append(again, cat);

    box.append(card, strategy, tierSection, dubbingSection, actions, msg);
  }

  applySiteTheme();
  const S = await loadData();
  if (S && S.title) {
    renderReport(S);
  } else {
    $("report").replaceChildren(
      el("div", { "class": "empty" },
        el("p", {}, "No anime details found. Please fill in the form first."),
        el("a", { "class": "btn primary", "href": "input.html" }, "Go to input page"))
    );
  }

  // Falling petals
  const petals = $("petals");
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    const s = 8 + Math.random() * 10;
    p.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${10 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s`;
    petals.append(p);
  }
</script>
</body>
