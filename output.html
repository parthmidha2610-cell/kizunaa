<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, getDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

  const YOUTUBE_API_KEY = "AIzaSyCtOBbegVwyJln20fsADy7yGKU3FdM_w0U";

  const firebaseConfig = {
    apiKey: "AIzaSyCdobRCI4rLnwx5lpd_ASIZeMfDiq433hA",
    authDomain: "kizuna-c70d2.firebaseapp.com",
    projectId: "kizuna-c70d2",
    storageBucket: "kizuna-c70d2.firebasestorage.app",
    messagingSenderId: "513173983571",
    appId: "1:513173983571:web:53b3da640e656eb6b2d1a6",
    measurementId: "G-66RQE9B093"
  };
  const db = getFirestore(initializeApp(firebaseConfig));

  const $ = id => document.getElementById(id);
  const el = (t, a = {}, ...c) => {
    const e = document.createElement(t);
    for (const k in a) e.setAttribute(k, a[k]);
    c.flat().forEach(x => e.append(x));
    return e;
  };
  const has = v => Array.isArray(v) ? v.length > 0 : v !== undefined && v !== "" && v !== null;

  // Safely normalizes any string or array field into a lowercase string array
  const normList = v => {
    if (!v) return [];
    if (Array.isArray(v)) return v.map(x => String(x || "").toLowerCase().trim()).filter(Boolean);
    return String(v).split(/[,·/|]/).map(x => x.toLowerCase().trim()).filter(Boolean);
  };

  function formatNumber(num) {
    if (!num) return "0";
    if (num >= 1000000) return (num / 1000000).toFixed(1) + "M";
    if (num >= 1000) return (num / 1000).toFixed(1) + "K";
    return num.toString();
  }

  /* ---------- 1. Load data: Firestore (if ?id=) or this tab's session ---------- */
  let savedId = new URLSearchParams(location.search).get("id");

  function fromPayload(p) {
    return {
      title: p.identity?.title || p.title,
      story: p.identity?.story || p.story,
      genres: p.identity?.genres || p.genres,
      themes: p.identity?.themes || p.themes,
      tone: p.identity?.tone || p.tone,
      demo: p.demographics?.target || p.demo,
      eps: p.format?.eps ?? p.eps,
      len: p.format?.len ?? p.len,
      src: p.format?.src || p.src,
      status: p.format?.status || p.status,
      studio: p.production?.studio || p.studio,
      director: p.production?.director || p.director,
      viol: p.sensitivity?.viol || p.viol,
      sex: p.sensitivity?.sex || p.sex,
      rate: p.sensitivity?.rate || p.rate,
      langs: p.market?.langs || p.langs,
      plat: p.market?.plat || p.plat,
      timing: p.market?.timing || p.timing,
      rights: p.market?.rights || p.rights,
      coverImageUrl: p.media?.coverImageUrl || p.coverImageUrl
    };
  }

  async function loadData() {
    if (savedId) {
      try {
        const snap = await getDoc(doc(db, "anime_profiles", savedId));
        if (snap.exists()) return fromPayload(snap.data());
      } catch (e) { console.error("Load error:", e); }
    }
    try {
      const raw = sessionStorage.getItem("kizunaReport");
      if (raw) return fromPayload(JSON.parse(raw));
    } catch (e) {}
    return null;
  }

  /* ---------- 2. Prediction engine ---------- */
  function predictAudience(S) {
    const scores = { kids: 0, genz: 0, millennials: 0 };
    const strData = JSON.stringify({
      genres: S.genres, themes: S.themes, tone: S.tone, demo: S.demo,
      viol: S.viol, sex: S.sex, rate: S.rate
    }).toLowerCase();

    if (strData.includes("kids") || strData.includes("family")) scores.kids += 5;
    if (strData.includes("wholesome")) scores.kids += 3;
    if (strData.includes("all ages")) scores.kids += 3;

    if (strData.includes("shonen") || strData.includes("shojo")) scores.genz += 5;
    if (strData.includes("action") || strData.includes("adventure") || strData.includes("sports")) scores.genz += 3;
    if (strData.includes("coming of age") || strData.includes("school life") || strData.includes("sports rivalry")) scores.genz += 3;

    if (strData.includes("seinen") || strData.includes("josei")) scores.millennials += 5;
    if (strData.includes("psychological") || strData.includes("thriller") || strData.includes("suspense") || strData.includes("crime")) scores.millennials += 4;
    if (strData.includes("workplace") || strData.includes("conspiracy")) scores.millennials += 3;
    if (strData.includes("r-17+") || strData.includes("r+") || strData.includes("strong")) scores.millennials += 4;

    const max = Math.max(scores.kids, scores.genz, scores.millennials);
    let winner = "genz";
    if (max === scores.kids && max > 0) winner = "kids";
    else if (max === scores.millennials && max > 0) winner = "millennials";
    return winner;
  }

  const SEGMENTS = {
    kids: {
      short: "Kids", icon: "🧒", accent: "#f59e0b", age: [6, 12], ageLabel: "6–12 Years",
      aud: "Predicted Target: Kids (6–12 Years)",
      level: 20, levelLabel: "Low", levelNote: "Parent-dependent purchasing",
      price: [10, 250], priceText: "₹10 – ₹250",
      merch: [
        { i: "🍫", n: "FMCG tie-ins", d: "Snacks, candies" },
        { i: "✏️", n: "Basic stationery", d: "School essentials" },
        { i: "🧸", n: "Small domestic toys", d: "Locally made" }
      ],
      model: "Volume-Driven", volume: 90, margin: 25,

  function applySiteTheme() {
    const root = document.documentElement.style;
    const probe = el("button", { "class": "btn primary", "type": "button", "style": "position:absolute;visibility:hidden;pointer-events:none" }, "x");
    document.body.append(probe);
    const cs = getComputedStyle(probe);
    const clear = c => !c || c === "transparent" || /,\s*0\)$/.test(c);
    const first = c => (c.match(/rgba?\([^)]+\)/) || [""])[0];
    let accent = cs.backgroundColor;
    if (clear(accent)) accent = first(cs.backgroundImage);
    if (clear(accent)) accent = cs.borderTopColor;
    if (clear(accent)) accent = cs.color;
    if (!clear(accent)) root.setProperty("--accent", accent);
    const on = cs.color;
    if (!clear(on) && on !== accent) root.setProperty("--on-accent", on);
    probe.remove();
    const h = document.querySelector("h1");
    if (h) root.setProperty("--head-font", getComputedStyle(h).fontFamily);
  }

  const AGE_GROUPS = [

  const SEG_AGE = { kids: "25-34", genz: "18-24", millennials: "25-34" };
  const WEIGHTS = { R: 0.35, I: 0.30, E: 0.20, C: 0.15 };
  const TIERS = [
    { t: "S", min: 85, range: "85–100", label: "Primary advertising channel", hint: "First campaign test" },

    { id: "creators", name: "Anime creator channels", fmt: "Review and reaction collaborations" },

    { id: "reddit", name: "Reddit", fmt: "Community discussions and AMAs" },
    { id: "discord", name: "Discord", fmt: "Community partnerships" }
  ];
  const PROTO = {
    "13-17": { youtube: [92, 85, 80, 80], instagram: [80, 65, 70, 65], creators: [55, 85, 80, 75], snapchat: [70, 45, 50, 60], reddit: [20, 60, 50, 70], discord: [40, 70, 50, 40] },
    "18-24": { youtube: [95, 85, 80, 80], instagram: [90, 70, 70, 65], creators: [60, 90, 85, 75], snapchat: [55, 45, 45, 60], reddit: [35, 70, 60, 70], discord: [25, 70, 45, 40] },

  };
  const REACH = [["YouTube", 500], ["Instagram", 481], ["Snapchat", 213], ["Reddit", 30.8]];

  const ageLabel = key => AGE_GROUPS.find(a => a.key === key).label;
  const clamp = v => Math.min(100, Math.max(0, v));
  const adScore = (r, i, e, c) => WEIGHTS.R * r + WEIGHTS.I * i + WEIGHTS.E * e + WEIGHTS.C * c;
  const tierOf = sc => TIERS.find(t => sc >= t.min).t;
  const normPlatform = s => {
    const k = String(s || "").toLowerCase().replace(/[^a-z]/g, "");
    const alias = { instagramreels: "instagram", animecreatorchannels: "creators", creator: "creators", creatorchannels: "creators" };
    return alias[k] || k;
  };

  const statCache = {};
  async function loadStats(ageKey) {
    if (statCache[ageKey]) return statCache[ageKey];
    const rows = {};
    PLATFORMS.forEach(p => {
      const v = PROTO[ageKey][p.id];
      rows[p.id] = { p, r: v[0], i: v[1], e: v[2], c: v[3], source: "Illustrative", live: false };
    });
    try {
      const snap = await getDocs(query(collection(db, "social_media_age_stats"), where("age_group", "==", ageKey)));
      snap.forEach(d => {
        const x = d.data(), id = normPlatform(x.platform);
        if (!rows[id]) return;
        const n = [x.reach_score, x.anime_interest_score, x.engagement_score, x.cost_efficiency_score];
        if (n.every(v => typeof v === "number" && isFinite(v))) {
          Object.assign(rows[id], { r: clamp(n[0]), i: clamp(n[1]), e: clamp(n[2]), c: clamp(n[3]), source: x.data_source || "KIZUNA data", live: true });
        }
      });
    } catch (e) { console.warn("social_media_age_stats not available:", e.message); }
    const out = Object.values(rows).map(r => {
      const score = adScore(r.r, r.i, r.e, r.c);
      return Object.assign(r, { score, tier: tierOf(score) });
    }).sort((a, b) => b.score - a.score);
    statCache[ageKey] = out;
    return out;
  }

        div("ev-stat", "73.1%"),
        div("ev-label", "Prefer Hindi among dubbed-language choices"),
        el("div", { "class": "ev-src" }, "Surveyed anime viewers · ", hakuLink2)),
      div("ev-card",
        span("kicker", "Platform consumption signal"),
        div("ev-stat", "> 65%"),
        div("ev-label", "Crunchyroll India anime viewership from Hindi, Tamil, and Telugu dubs"),
        el("div", { "class": "ev-src" }, "Source: ", bsLink))
    );

    const cardResearch = secCard("11", "What the Research Says About Dubbing in India",
      el("p", { "class": "strat-text", "style": "margin-bottom:14px" }, "There is real evidence that dubbing can improve accessibility and viewership, though every launch must be evaluated with its own unit economics."),
      evGrid,
      div("notice",
        el("strong", {}, "Scope & methodology caveats: "),
        "The Hakuhodo India survey (2026) focused on interested anime viewers aged 15–39 in selected Indian cities, not India's entire population. Furthermore, while Crunchyroll reported that more than 65% of its anime viewership in India came from Hindi, Tamil, and Telugu dubs, this is a strong signal for localization—not a 65% probability that any new anime will succeed.")
    );

    return div("tiersec",
      el("h2", { "class": "tiersec-title" }, "Dubbing Language Priority"),
      el("p", { "class": "hint" }, "Which Indian languages should a Japanese studio dub into?"),
      div("strategy", cardPriority, cardResearch)
    );
  }

  /* ---------- Card 12: Comparable Catalog Benchmarks + Google Trends & YouTube Links ---------- */
  async function fetchYouTubeStats(title) {
    try {
      const ytSearch = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(title + " anime official trailer")}&type=video&maxResults=1&key=${YOUTUBE_API_KEY}`);
      const searchData = await ytSearch.json();
      if (searchData.items && searchData.items.length > 0) {
        const videoId = searchData.items[0].id.videoId;
        const ytStats = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoId}&key=${YOUTUBE_API_KEY}`);
        const statsData = await ytStats.json();
        const views = (statsData.items && statsData.items.length > 0)
          ? parseInt(statsData.items[0].statistics.viewCount, 10)
          : 0;
        return { videoId, views };
      }
    } catch (e) {
      console.warn("YouTube stats fetch skipped for", title, e);
    }
    return { videoId: "", views: 0 };
  }

  function renderComparableSection(S) {
    const comparableBody = div("comparable-body", el("p", { "class": "loading" }, "Querying Firebase catalog for 3 comparable titles…"));

    async function loadComparables() {
      let top3 = [];
      const currentTitle = String(S.title || "").toLowerCase().trim();
      const currentGenres = normList(S.genres);
      const currentThemes = normList(S.themes);
      const currentTone = normList(S.tone);
      const currentDemo = normList(S.demo);
      const currentRate = normList(S.rate);

      try {
        const snap = await getDocs(collection(db, "anime_profiles"));
        const allAnime = [];
        snap.forEach(d => {
          const data = d.data() || {};
          const itemTitle = String(data.identity?.title || data.title || "").trim();
          if (d.id !== savedId && itemTitle && itemTitle.toLowerCase() !== currentTitle) {
            allAnime.push({ id: d.id, data });
          }
        });

        const scored = allAnime.map(({ id, data }) => {
          const itemGenres = normList(data.identity?.genres || data.genres);
          const itemThemes = normList(data.identity?.themes || data.themes);
          const itemTone = normList(data.identity?.tone || data.tone);
          const itemDemo = normList(data.demographics?.target || data.demo);
          const itemRate = normList(data.sensitivity?.rate || data.rate);

          let score = 0;
          currentGenres.forEach(g => { if (itemGenres.includes(g)) score += 4; });
          currentThemes.forEach(th => { if (itemThemes.includes(th)) score += 3; });
          currentTone.forEach(tn => { if (itemTone.includes(tn)) score += 2; });
          currentDemo.forEach(dm => { if (itemDemo.includes(dm)) score += 3; });
          currentRate.forEach(rt => { if (itemRate.includes(rt)) score += 1; });

          return {
            id,
            title: data.identity?.title || data.title || "Untitled",
            genres: normList(data.identity?.genres || data.genres),
            demo: data.demographics?.target || data.demo || "",
            cover: data.media?.coverImageUrl || data.coverImageUrl || "",
            score
          };
        });

        scored.sort((a, b) => b.score - a.score);
        top3 = scored.slice(0, 3);
      } catch (e) {
        console.warn("Firebase catalog read error, using fallback benchmarks:", e);
      }

      if (top3.length === 0) {
        top3 = [
          { title: "Jujutsu Kaisen", genres: ["action", "supernatural"], demo: "Shonen", cover: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg" },
          { title: "Demon Slayer", genres: ["action", "fantasy"], demo: "Shonen", cover: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg" },
          { title: "Chainsaw Man", genres: ["action", "dark fantasy"], demo: "Shonen", cover: "https://cdn.myanimelist.net/images/anime/1806/126216.jpg" }
        ];
      }

      const grid = div("comp-grid");

      for (const anime of top3) {
        const title = anime.title;
        const genreLabel = anime.genres && anime.genres.length ? anime.genres.slice(0, 2).join(", ") : "Anime";
        const trendsUrl = `https://trends.google.com/trends/explore?geo=IN&q=${encodeURIComponent(title)}`;
        const ytFallbackUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(title + " anime official trailer")}`;

        const viewsNode = span("comp-views", "Checking trailer views…");
        const ytBtn = el("a", {
          "href": ytFallbackUrl,
          "target": "_blank",
          "rel": "noopener",
          "class": "trends-btn yt-btn"
        }, "▶️ Watch Trailer");

        const trendsBtn = el("a", {
          "href": trendsUrl,
          "target": "_blank",
          "rel": "noopener",
          "class": "trends-btn"
        }, "📈 Google Trends");

        const imgNode = anime.cover
          ? el("img", { "src": anime.cover, "alt": title, "class": "comp-cover", "referrerpolicy": "no-referrer" })
          : span("micon", "🎬");
        if (anime.cover) imgNode.onerror = () => imgNode.replaceWith(span("micon", "🎬"));

        const cardNode = div("comp-card",
          imgNode,
          el("strong", { "style": "font-size:16px" }, title),
          span("mdesc", `Genres: ${genreLabel}`),
          viewsNode,
          div("action-row", trendsBtn, ytBtn)
        );
        grid.append(cardNode);

        // Enrich with YouTube trailer views and direct video link (just like catalog.html)
        fetchYouTubeStats(title).then(({ videoId, views }) => {
          if (videoId) {
            ytBtn.setAttribute("href", `https://www.youtube.com/watch?v=${videoId}`);
          }
          viewsNode.textContent = views > 0
            ? `Trailer Views: ${formatNumber(views)}`
            : "Official Trailer & Search Interest";
        });
      }

      const multiTrendsQuery = top3.map(a => a.title).join(",");
      const multiTrendsUrl = `https://trends.google.com/trends/explore?geo=IN&q=${encodeURIComponent(multiTrendsQuery)}`;

      const compareBar = div("trends-compare-bar",
        span("", `Compare all 3 comparable titles side-by-side on Google Trends (India Heatmap):`),
        el("a", { "href": multiTrendsUrl, "target": "_blank", "rel": "noopener", "class": "trends-btn" }, "📈 Compare All 3 on Google Trends")
      );

      comparableBody.replaceChildren(
        el("p", { "class": "strat-text", "style": "margin-bottom:14px" },
          `Top 3 comparable titles from the KIZUNA catalog matched against "${S.title || 'this title'}" using genre, theme, tone, and demographic data:`),
        grid,
        compareBar
      );
    }

    loadComparables();

    const cardComp = secCard("12", "Comparable Catalog Benchmarks & Google Trends Links",
      span("kicker", "Firebase Catalog Similarity Engine + Live Market Links"),
      comparableBody,
      span("caption", "Matched against stored anime_profiles in Firebase. Click '📈 Google Trends' on any comparable title to inspect its regional demand heatmap across Indian states and cities.")
    );

    return div("tiersec",
      el("h2", { "class": "tiersec-title" }, "Catalog Benchmark Analysis"),
      el("p", { "class": "hint" }, "Which 3 titles in the KIZUNA database are most comparable, and how do they perform on Google Trends India & YouTube?"),
      div("strategy", cardComp)
    );
  }

  /* ---------- 3. Save from the report page ---------- */
  async function saveNow(S) {
    const payload = {
      identity: { title: S.title || "", genres: S.genres || [], story: S.story || "", themes: S.themes || [], tone: S.tone || "" },
      demographics: { target: S.demo || "" },
      format: { eps: S.eps || 0, len: S.len || 0, src: S.src || "", status: S.status || "" },
      production: { studio: S.studio || "", director: S.director || "" },
      sensitivity: { viol: S.viol || "", sex: S.sex || "", rate: S.rate || "" },
      market: { langs: S.langs || [], plat: S.plat || "", timing: S.timing || "", rights: S.rights || "" },
      media: { coverImageUrl: S.coverImageUrl || "" },
      createdAt: new Date().toISOString()
    };
    return (await addDoc(collection(db, "anime_profiles"), payload)).id;
  }

  /* ---------- 4. Render ---------- */
  function renderReport(S) {
    const box = $("report");
    box.replaceChildren();

    const genresArr = normList(S.genres);
    const themesArr = normList(S.themes);

    const point = (k, v) => el("div", { "class": "pt" },
      el("span", { "class": "k" }, k),
      el("span", { "class": "v" }, has(v) ? v : "Not provided"));

    const toneTheme = [
      Array.isArray(S.tone) ? S.tone.join(", ") : S.tone,
      has(S.themes) ? (Array.isArray(S.themes) ? S.themes[0] : S.themes) : ""
    ].filter(Boolean).join(" · ");

    const card = el("div", { "class": "portfolio" });
    if (S.coverImageUrl) {
      const img = el("img", { "class": "cover", src: S.coverImageUrl, alt: "Cover of " + (S.title || "the anime"), referrerpolicy: "no-referrer" });
      img.onerror = () => img.remove();
      card.append(img);
    }
    card.append(
      el("div", { "class": "name" },
        el("p", { "class": "tag" }, "Anime portfolio"),
        el("h2", {}, S.title || "Untitled anime")),
      el("div", { "class": "points" },
        point("Main genre", has(S.genres) ? (Array.isArray(S.genres) ? S.genres[0] : S.genres) : (genresArr[0] || "")),
        point("Age rating", S.rate),
        point("Demographic tag", S.demo),
        point("Tone / Theme", toneTheme || themesArr[0] || ""))
    );

    const segKey = predictAudience(S);
    const strategy = renderStrategy(SEGMENTS[segKey]);
    const tierSection = renderTierSection(segKey, S);
    const dubbingSection = renderDubbingSection(S);
    const comparableSection = renderComparableSection(S);

    const actions = el("div", { "class": "actions" });
    const msg = el("p", { "class": "note", "role": "status", "style": "font-weight:bold;margin-top:10px" });

    if (savedId) {
      msg.textContent = "✅ This title is saved in the KIZUNA database.";
      msg.style.color = "#2e7d32";
    } else {
      const saveBtn = el("button", { "type": "button", "class": "btn" }, "Save to KIZUNA database");
      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        msg.style.color = "#666";
        msg.textContent = "⏳ Saving...";
        try {
          savedId = await saveNow(S);
          history.replaceState(null, "", "output.html?id=" + encodeURIComponent(savedId));
          msg.style.color = "#2e7d32";
          msg.textContent = "✅ Saved to the KIZUNA database.";
          saveBtn.remove();
        } catch (e) {
          console.error(e);
          msg.style.color = "#d32f2f";
          msg.textContent = "❌ Error: " + e.message;
          saveBtn.disabled = false;
        }
      };
      actions.append(saveBtn);
    }
    const again = el("a", { "class": "btn", "href": "input.html" }, "← Edit details");
    const cat = el("a", { "class": "btn primary", "href": "catalog.html" }, "View catalog");
    actions.append(again, cat);

    box.append(card, strategy, tierSection, dubbingSection, comparableSection, actions, msg);
  }

  applySiteTheme();
  const S = await loadData();
  if (S && S.title) {
    renderReport(S);
  } else {
    $("report").replaceChildren(
      el("div", { "class": "empty" },
        el("p", {}, "No anime details found. Please fill in the form first."),
        el("a", { "class": "btn primary", "href": "input.html" }, "Go to input page"))
    );
  }

  const petals = $("petals");
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    const s = 8 + Math.random() * 10;
    p.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${10 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s`;
    petals.append(p);
  }
</script>
</body>
